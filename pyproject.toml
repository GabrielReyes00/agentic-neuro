[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-neuro-harness"
version = "0.1.0"
description = "Local workflow, retrieval, learner-memory, and artifact tooling for neurosurgical training"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<2; python_version < '3.13'",
  "numpy>=2,<3; python_version >= '3.13'",
  "Pillow>=10,<13",
  "pydantic>=2,<3",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
  "tiktoken>=0.12,<1",
]

[project.optional-dependencies]
retrieval = [
  "FlagEmbedding>=1.3,<2",
  "fastembed>=0.8,<1",
  "huggingface-hub>=0.30,<1",
  "lancedb>=0.27,<1",
  "pyarrow>=18,<24",
  "safetensors>=0.5,<1",
  "sentence-transformers>=3.4,<6",
  "torch>=2,<3",
  "transformers>=4.44.2,<5",
]
anki = [
  "chromadb>=0.6,<2",
  "fastembed>=0.8,<1",
]
dev = [
  "lancedb>=0.27,<1",
  "pytest>=8,<10",
]
full = [
  "FlagEmbedding>=1.3,<2",
  "chromadb>=0.6,<2",
  "fastembed>=0.8,<1",
  "huggingface-hub>=0.30,<1",
  "lancedb>=0.27,<1",
  "pyarrow>=18,<24",
  "safetensors>=0.5,<1",
  "sentence-transformers>=3.4,<6",
  "torch>=2,<3",
  "transformers>=4.44.2,<5",
]

[tool.setuptools]
packages = ["src", "src.anki_sync", "src.retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
