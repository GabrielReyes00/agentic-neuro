description = "Brief direct answer with lightweight memory logging, no startup recall, and optional Anki"

prompt = """
ACTIVE COMMAND: /quick-answer — Brief direct answer with lightweight memory logging.

You MUST read and follow `.agents/shared/commands/quick-answer.md`.

Hard requirements:
- Do not run startup memory recall.
- Do not use the shared learning-session contract.
- Do not run RAG, create a vault artifact, ask verification questions, or create Anki cards by default.
- Answer the user's question normally.
- Log the exchange through `study_memory.py log-answer`, then close it with `study_memory.py end-session --json`.
- Create Anki cards only if Gabriel explicitly asks for them after the answer.

User's input: {{args}}

---

@{.gemini/commands/quick-answer.md}
"""
