description = "Focused expert consult on a clinical topic — brief lecture, verification questions, Anki cards, pocket-card vault note"

prompt = """
ACTIVE COMMAND: /consult — Focused expert consult on a clinical topic.

You MUST read and follow `.agents/shared/commands/consult.md` end-to-end. Do not improvise. The shared command defines role, teaching principles, quality floors, and finish protocol.

Hard requirements:
- This is a LECTURE-FIRST skill. Deliver the information, THEN ask verification questions. Do NOT withhold information behind Socratic questions.
- No calibration questions ("what do you know about X?"). Start teaching immediately.
- ALWAYS run textbook RAG via `lance_retriever.py compare --stdout` before the lecture. Use retrieved passages to ground the lecture in authoritative sources.
- Memory recall informs teaching approach, NEVER content omission. Deliver full applicable knowledge regardless of prior exposure.
- Pocket card in Consults/ must be >= 40 lines, dense, actionable.
- At least 2 verification questions logged via log-answer.
- At least 3 Anki cards from lecture content (thresholds, drugs, doses, imaging, exams).
- Additional Anki cards for verification question misses.
- Success criterion: the resident can manage or co-manage the problem after this consult.

User's input: {{args}}

---

@{.gemini/commands/consult.md}
"""
