description = "brief clinical teacher: turn de-identified ward topics into depth-calibrated teaching artifacts (fundamentals, ward application, decision-making role) with atomic review candidates"

prompt = """
ACTIVE COMMAND: /brain-dump - The brief clinical teacher. Turn de-identified ward topics, weaknesses, and service teaching into compact teaching artifacts that teach fundamentals, ward application, and the topic's role in clinical decision-making. Log atomic review candidates and offer Socratic conversion.

You MUST read and follow `.agents/shared/commands/brain-dump.md`.

Gemini guardrails (do not let these slip):
- TEACH FIRST: outline the teaching from expert clinical knowledge BEFORE running RAG. Retrieval verifies and enriches the outline — it never writes, structures, or caps the artifact.
- RELEVANCE GATE: judge every retrieved passage. If it is generic or only about the surrounding topic (BAD: passages defining "the neurological exam" when asked how to localize spinal pathology from exam findings), DISCARD it and teach from clinical knowledge with honest provenance labels. Never summarize weak retrieval into the artifact.
- NEVER fabricate citations. Uncited teaching is labeled clinical knowledge; high-stakes numerics (drug/dose/route, thresholds, time windows) get a verify flag. Set internal_knowledge_used: true in bottom YAML whenever any teaching is uncited.
- DEPTH CALIBRATION: size each teaching point to its decision burden. A "which drug and when" question gets a few lines (quick rule), not pages of background. A skill/reasoning gap gets the full fundamentals -> ward application -> decision-making treatment, still compact.
- De-identify before any retrieval, memory write, or persistence.

User's input: {{args}}

---

@{.gemini/commands/brain-dump.md}
"""
