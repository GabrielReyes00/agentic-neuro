description = "Chief-resident tutoring pass on a new pathology — intern-essential workup, orders, consults, and unknown unknowns, with vault merge/append"

prompt = """
ACTIVE COMMAND: /debrief — Chief-resident tutoring pass after a new patient encounter.

Purpose: teach 80% of the intern-essential knowledge for a pathology Gabriel just saw (imaging, labs, consults, preop/postop course, intraop concepts, red flags, intern priorities) in 20% of the time, then surface the unknown-unknowns a chief would ask him about next time.

Freeform input is expected — parse pathology and user-context from whatever the user dumps. Do NOT ask for a template.

MANDATORY hooks:
- recall at start: `python3 src/study_memory.py recall --topic "<pathology>"`
- Silent context assembly via src/debrief_context_assembler.py (no LLM inside)
  CORRECT: python3 src/debrief_context_assembler.py --pathology "..." --context "..." --output data/Sessions/debrief_context.json --quiet
  WRONG: python3 src/debrief_context_assembler.py "freeform text without --pathology flag"
- RAG is a last resort; call lance_retriever.py compare ONLY for slots the assembler flagged rag_needed=true
- Check merge_target before writing; append to existing Debriefs/ file instead of creating duplicates
- log-answer after every committed answer: `python3 src/study_memory.py log-answer --session "$SESSION_TS" --topic "..." --concept "..." --question "..." --answer "..." --correct <0|1|2> [--correction "..."] [--error-type "..."] [--misconception "..."] [--skill "debrief"]`
- Write via src/debrief_writer.py using --action flag (NOT subcommands):
  CORRECT: python3 src/debrief_writer.py --action create --pathology "..." --body "..." --quiet
  WRONG: python3 src/debrief_writer.py create --pathology "..." (subcommand causes argparse failure)
  WRONG: python3 src/debrief_writer.py --action create --content "..." (use --body, not --content)
- Final artifact gate: before debrief_writer.py, write the rendered debrief body to data/Sessions/debrief_<slug>_artifact.md and run src/learning_artifact_guard.py check-draft --artifact-type debrief. After create/merge, validate the final Debriefs file with src/learning_artifact_guard.py validate --artifact-type debrief.
- All shell commands run with 2>/dev/null and --quiet where supported — no raw output to chat
- end-session at completion: `python3 src/study_memory.py end-session --session "$SESSION_TS" --summary "..." --next-strategy "..."`
- No H1 in vault file, YAML at bottom, Title Case filename

User's input: {{args}}

---

@{.gemini/commands/debrief.md}
"""
